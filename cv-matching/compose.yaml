# Prérequis : cvmatch pipeline --to embed   (catalogue + embeddings générés)
# Démarrage : cp .env.example .env  (puis GEMINI_API_KEY) ; docker compose up --build
services:
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      CVMATCH_HOME: /app
    volumes:
      - ./data/processed:/app/data/processed:ro   # offres (lecture seule)
      - ./artifacts:/app/artifacts:ro             # embeddings (lecture seule)
      - ./data/cache:/app/data/cache              # cache Gemini (écriture)
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  ui:
    build:
      context: .
      dockerfile: docker/ui.Dockerfile
    environment:
      API_URL: http://api:8000
    ports:
      - "8501:8501"
    depends_on:
      api:
        condition: service_healthy
